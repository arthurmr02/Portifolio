<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio de desenvolvimento front-end: projetos carregados direto do GitHub, feitos com React."
    />
    <meta name="theme-color" content="#0c0d10" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Portfolio</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura, evitando flash de tema errado.
      // Padrao: escuro. Mantenha a chave igual a THEME_STORAGE_KEY em src/lib/theme.js.
      try {
        var saved = localStorage.getItem('portfolio-theme');
        if (saved !== 'light') document.documentElement.classList.add('dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
